<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Contact Jael Dede Amoo — Cybersecurity & AI Engineer." />
  <title>Contact | Jael Dede Amoo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html#home" aria-label="Jael Dede Amoo home"></a>

    <nav class="nav" aria-label="Primary navigation">
      <a href="index.html#home">Home</a>
      <a href="index.html#about">About</a>
      <a href="index.html#portfolio">Portfolio</a>
      <a href="contact.html" aria-current="page">Contact</a>
    </nav>

    <div class="header-actions">
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
        <span class="toggle-sun" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <circle cx="12" cy="12" r="4.2"></circle>
            <path d="M12 2v2.2M12 19.8V22M4.93 4.93l1.56 1.56M17.51 17.51l1.56 1.56M2 12h2.2M19.8 12H22M4.93 19.07l1.56-1.56M17.51 6.49l1.56-1.56"></path>
          </svg>
        </span>
        <span class="toggle-thumb" aria-hidden="true">
          <svg class="thumb-moon" viewBox="0 0 24 24" width="12" height="12" fill="currentColor">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </span>
      </button>
      <a class="button button-small" href="contact.html">Hire Me</a>
    </div>
  </header>

  <main class="contact-page">
    <section class="contact-hero">
      <div class="contact-intro">
        <div class="section-label">CONTACT</div>
        <h1>Let’s work together.</h1>
        <p>
          Have a project, opportunity, or idea you’d like to discuss?
          Send me a message and I’ll get back to you.
        </p>

        <div class="contact-info">
          <a href="mailto:amoojael87@gmail.com">amoojael87@gmail.com</a>
          <a href="tel:+233248283682">+233 24 828 3682</a>
          <span>Accra, Ghana</span>
        </div>
      </div>

      <form class="contact-form" action="https://formspree.io/f/mwlpyzjj" method="POST">
        <div class="form-field">
          <label for="name">Name</label>
          <input id="name" type="text" name="name" autocomplete="name" required />
        </div>

        <div class="form-field">
          <label for="email">Email</label>
          <input id="email" type="email" name="email" autocomplete="email" required />
        </div>

        <div class="form-field">
          <label for="subject">Subject</label>
          <input id="subject" type="text" name="subject" required />
        </div>

        <div class="form-field">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="7" required></textarea>
        </div>

        <button class="button contact-submit" type="submit">Send message</button>
      </form>
    </section>
  </main>

  <footer>
    <span>© <span id="year"></span> Jael Dede Amoo</span>
    <span>Cybersecurity &amp; AI Engineer</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
